[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archplan"
version = "26.10.17"
description = "Plan architecture changes with a human in an editor and an agent over MCP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
archplan = "archplan.cli:main"

[tool.setuptools.package-data]
archplan = ["static/*", "static/vendor/*", "format/*", "elixir/*", "ts/*", "contrib/*.md", "contrib/profiles/*.json", "contrib/exporters/*.json"]
