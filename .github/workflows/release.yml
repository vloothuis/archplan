name: Release

# Every push to develop (a merged pull request, or a direct push) becomes a
# release: run the tests, write the next CalVer version (YY.M.BUILD, see
# docs/releasing.md) into the version files, commit, tag and create the
# GitHub release. The release commit is pushed with GITHUB_TOKEN, which does
# not start workflows, so it does not release itself again.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Python 3.9, the oldest supported version, has no build for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    steps:
      # The branch head rather than the pushed commit: a run that waited for an
      # earlier one starts from that run's release commit.
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Skip when nothing changed since the last release
        id: check
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already $last"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.9"

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: PYTHONPATH=src python -m unittest tests.test_archplan tests.test_schema

      - name: Version, commit, tag and push
        if: steps.check.outputs.skip != 'true'
        id: tag
        run: |
          set -euo pipefail
          v=$(scripts/next-version.sh)
          IFS=. read -r yy m build <<< "$v"
          # Go wants major 0 or 1 for this module path, so the Go exporter gets
          # v0.YYMM.BUILD: v26.10.0 becomes v0.2610.0.
          go="exporters/archplan-go/v0.$((10#$yy * 100 + 10#$m)).$build"
          for t in "v$v" "$go"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "Tag $t already exists" >&2
              exit 1
            fi
          done
          scripts/set-version.sh "$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release v$v"
          git tag "v$v"
          git tag "$go"
          git push origin HEAD:develop "v$v" "$go"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.tag.outputs.version }}
        run: gh release create "v$V" --title "v$V" --generate-notes --verify-tag
